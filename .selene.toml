std = "roblox"
exclude = ["**/*.disabled.lua", "Vendor/**", "Packages/**", "DevPackages/**", "Generated/**", "tools/**", "scripts/*.luau", "tests/**"]

[rules]
global_usage = "deny"
unused_variable = "warn"
shadowing = "warn"
cyclomatic_complexity = "warn"
if_same_then_else = "warn"

[config.global_usage]
# Allow known framework globals (project + tests)
globals = [
    "MG",
    # TestEZ globals used in spec files
    "describe",
    "it",
    "beforeAll",
    "afterAll",
    "beforeEach",
    "afterEach",
    "expect",
]
